# =============================================================================
#  Release Build — 推送 tag 时自动跨平台打包（按 CPU 架构拆分）
# =============================================================================
#  触发：git push 任意 tag（建议语义化版本，如 v1.0.0）
#  产出：GitHub Release 附件，包含 Android / iOS / macOS / Windows / Linux
#        各架构独立包（Android 含 split-per-ABI 的 APK 与通用 AAB）
#
#  说明：
#   - iOS / macOS 必须在 macOS runner 上构建（含免费额度，但 macOS 分钟数
#     按 10 倍计费）
#   - 本流程不配置 Apple 证书，iOS 产物为「未签名」的 Runner.app，macOS 为
#     ad-hoc 签名；如需分发给他人，请自行配置证书 / 描述文件后重签
#   - Android 支持自定义签名：在仓库 Settings → Secrets 配置
#     ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD /
#     ANDROID_STORE_PASSWORD 后，workflow 会自动解码 keystore 并用其签名；
#     未配置 secrets 时回退到 debug 签名
# =============================================================================

name: Release Build

on:
  push:
    tags:
      - 'v*'          # 仅 tag 推送触发；如需所有 tag 可改为 '*'
  # 允许手动触发，方便调试 workflow 本身
  workflow_dispatch:

# 发布 Release 需要写权限
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # tag 发布不取消，确保产物完整

jobs:
  # ---------------------------------------------------------------------------
  # Android：一条命令按 ABI 拆分出多个 APK（armeabi-v7a / arm64-v8a / x86_64）
  # ---------------------------------------------------------------------------
  build-android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed / json_serializable)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # 自定义签名：配置了 secrets 时解码 keystore 并生成 key.properties
      - name: Decode Android signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs by ABI
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi=$(echo "$f" | sed -E 's/app-(.*)-release\.apk/\1/')
            mv "$f" "$GITHUB_WORKSPACE/kugou-music-android-$abi.apk"
          done

      # AAB：Google Play 上架用，单一通用包（不上架拆分），沿用上面的签名配置
      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Rename AAB
        run: |
          cd build/app/outputs/bundle/release
          mv app-release.aab "$GITHUB_WORKSPACE/kugou-music-android.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            kugou-music-android-*.apk
            kugou-music-android.aab
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Linux：矩阵 x64 / arm64（arm64 需要交叉编译工具链）
  # ---------------------------------------------------------------------------
  build-linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      # arm64 交叉编译：安装 aarch64 工具链
      - name: Install arm64 cross toolchain
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed / json_serializable)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Linux (${{ matrix.arch }})
        run: flutter build linux --release --target-platform linux-${{ matrix.arch }}

      - name: Package Linux
        run: |
          cd "build/linux/${{ matrix.arch }}/release/bundle"
          zip -r "$GITHUB_WORKSPACE/kugou-music-linux-${{ matrix.arch }}.zip" .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: kugou-music-linux-${{ matrix.arch }}.zip
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Windows：矩阵 x64 / arm64
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed / json_serializable)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Windows (${{ matrix.arch }})
        run: flutter build windows --release --target-platform windows-${{ matrix.arch }}

      - name: Package Windows
        shell: pwsh
        run: |
          $zip = "kugou-music-windows-${{ matrix.arch }}.zip"
          7z a -r $zip "build/windows/${{ matrix.arch }}/runner/Release/*"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: kugou-music-windows-${{ matrix.arch }}.zip
          retention-days: 30

  # ---------------------------------------------------------------------------
  # macOS：矩阵 x64 / arm64（仅在 macOS runner 可构建）
  # ---------------------------------------------------------------------------
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    env:
      DEVELOPMENT_TEAM: ""          # 不配置证书 -> ad-hoc 签名
      CODE_SIGN_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed / json_serializable)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build macOS (${{ matrix.arch }})
        run: flutter build macos --release --target-platform darwin-${{ matrix.arch }}

      - name: Package macOS
        run: |
          APP=$(find build/macos -maxdepth 4 -name "*.app" | head -n 1)
          echo "Packaging $APP"
          ditto -c -k --sequesterRsrc "$APP" "kugou-music-macos-${{ matrix.arch }}.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: kugou-music-macos-${{ matrix.arch }}.zip
          retention-days: 30

  # ---------------------------------------------------------------------------
  # iOS：设备架构 arm64（未签名 .app，供自签/企业分发）
  # ---------------------------------------------------------------------------
  build-ios:
    name: iOS (arm64, no codesign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed / json_serializable)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package iOS
        run: |
          APP=$(find build/ios -maxdepth 4 -name "Runner.app" | head -n 1)
          echo "Packaging $APP"
          ditto -c -k --sequesterRsrc "$APP" "kugou-music-ios-arm64.zip"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-arm64
          path: kugou-music-ios-arm64.zip
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Release：汇总所有产物，发布到对应 tag 的 GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Publish Release
    needs: [build-android, build-linux, build-windows, build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
